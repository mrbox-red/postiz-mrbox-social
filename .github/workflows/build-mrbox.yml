name: "Build Mr Box Social image"

on:
  workflow_dispatch:
  push:
    branches: [mrbox]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (amd64)
        env:
          IMAGE: ghcr.io/mrbox-red/postiz-mrbox-social
          SHORT_SHA: ${{ github.sha }}
        run: |
          SHORT=${SHORT_SHA::7}
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=mrbox-$SHORT \
            --provenance=false --sbom=false \
            -t $IMAGE:latest -t $IMAGE:$SHORT \
            --push .
